<!--/*
    A container instance can opt IN to a contained (1140px) width for its *content* via the
    "Contained width" dialog checkbox (default off). The outer div - which carries the
    container's id/class/background-color styling - always renders full width, so a
    background color set on a container always bleeds edge to edge regardless of this
    setting. Only the content inside (columns/children) gets wrapped in gcds-container when
    checked, so a section can have a full-bleed background with constrained, centered text -
    the two are independent, where previously checking "Contained width" constrained the
    whole container (background included).

    This split lives in our own responsiveGrid.html/simple.html (copied from core's, not
    core's originals) since core's versions render the id/class/background div and the
    children in a single template with no seam to insert a wrapper around just the children.
*/-->
<sly data-sly-use.container="com.adobe.cq.wcm.core.components.models.LayoutContainer"
     data-sly-use.responsiveGridTemplate="responsiveGrid.html"
     data-sly-use.simpleTemplate="simple.html">
    <sly data-sly-test="${container.layout == 'RESPONSIVE_GRID'}" data-sly-call="${responsiveGridTemplate.responsiveGrid @ container=container}"></sly>
    <sly data-sly-test="${container.layout != 'RESPONSIVE_GRID'}" data-sly-call="${simpleTemplate.simple @ container=container}"></sly>
</sly>
